<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Guess Number</title>
</head>
<body>

<h1>111208094_Number Guessing Game</h1>
<div id="result"></div>

<script>
  const answer = Math.floor(Math.random() * 100) + 1;
  let chances = 7;
  let min = 1;
  let max = 100;

  while (chances > 0) {
    let input = prompt(
      `請輸入 ${min} 到 ${max} 的整數\n剩餘次數：${chances}`
    );

    if (input === null) break;
    input = input.trim();

    if (input === "" || isNaN(input)) {
      alert("輸入錯誤，請輸入數字");
      continue;
    }

    let guess = Number(input);

    if (guess < min || guess > max) {
      alert("超出合法範圍");
      continue;
    }

    chances--;

    if (guess === answer) {
      alert("恭喜你猜對了！");
      document.getElementById("result").innerHTML =
        '<img src="images/correct.jpg">';
      break;
    } else if (guess < answer) {
      min = guess + 1;
    } else {
      max = guess - 1;
    }

    if (chances === 0) {
      alert(`你輸了！答案是 ${answer}`);
      document.getElementById("result").innerHTML =
        '<img src="images/wrong.jpg">';
    }
  }
</script>

</body>
</html>
